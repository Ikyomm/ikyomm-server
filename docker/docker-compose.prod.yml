name: ikyomm-server

# Dokploy runs this from the clone root with
# `--project-directory <clone>/code -f ./docker/docker-compose.prod.yml`.
# Build context must be `.` (clone root). `context: ..` resolves to
# `<clone>/docker` and fails. Env-tab vars are written to `docker/.env`; bake
# may also look at `<clone>/code/.env`. Keep env_file paths optional. Do not
# re-list secrets under `environment:` — empty `${VAR}` would override env_file.
x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: false
    - path: docker/.env
      required: false
    - path: ../.env
      required: false
  networks:
    - dokploy-network
  stop_grace_period: 20s
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging:
    driver: local
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:${GATEWAY_PORT:-8000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GATEWAY_PORT: ${GATEWAY_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      AUTH_SERVICE_URL: http://auth:${AUTH_PORT:-6001}
      COMPANY_SERVICE_URL: http://company:${COMPANY_PORT:-6005}
      KERNEL_SERVICE_URL: http://kernel:${KERNEL_PORT:-6003}
      OMMPODS_SERVICE_URL: http://ommpods:${OMMPODS_PORT:-6007}
      ECOMMERCE_SERVICE_URL: http://ecommerce:${ECOMMERCE_PORT:-6008}
    depends_on:
      auth:
        condition: service_healthy
      kernel:
        condition: service_healthy
      company:
        condition: service_healthy
      ommpods:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${GATEWAY_PORT:-8000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/auth.Dockerfile
    container_name: auth
    ports:
      - "${AUTH_HOST_PORT:-6001}:${AUTH_PORT:-6001}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_PORT: ${AUTH_PORT:-6001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    healthcheck:
      test:
