name: ikyomm-server

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  networks:
    - dokploy-network
  stop_grace_period: 20s
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging:
    driver: local
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE}
      max-file: ${DOCKER_LOG_MAX_FILE}

services:
  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:${GATEWAY_PORT:-8000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GATEWAY_PORT: ${GATEWAY_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      COMPANY_SERVICE_URL: ${COMPANY_SERVICE_URL}
      KERNEL_SERVICE_URL: ${KERNEL_SERVICE_URL}
      OMMPODS_SERVICE_URL: ${OMMPODS_SERVICE_URL}
    depends_on:
      auth:
        condition: service_healthy
      kernel:
        condition: service_healthy
      company:
        condition: service_healthy
      ommpods:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${GATEWAY_PORT:-8000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/auth.Dockerfile
    container_name: auth
    ports:
      - "${AUTH_HOST_PORT:-6001}:${AUTH_PORT:-6001}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_PORT: ${AUTH_PORT:-6001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_CROSS_SUBDOMAIN_COOKIES: ${BETTER_AUTH_CROSS_SUBDOMAIN_COOKIES:-false}
      BETTER_AUTH_COOKIE_DOMAIN: ${BETTER_AUTH_COOKIE_DOMAIN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}
      RESEND_FROM: ${RESEND_FROM}
      RESEND_TIMEOUT: ${RESEND_TIMEOUT}
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${AUTH_PORT:-6001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kernel:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/kernel.Dockerfile
    container_name: kernel
    ports:
      - "${KERNEL_HOST_PORT:-6003}:${KERNEL_PORT:-6003}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      KERNEL_PORT: ${KERNEL_PORT:-6003}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: http://auth:${AUTH_PORT:-6001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}
      RESEND_FROM: ${RESEND_FROM}
      RESEND_TIMEOUT: ${RESEND_TIMEOUT}
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${KERNEL_PORT:-6003}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  company:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/company.Dockerfile
    container_name: company
    ports:
      - "${COMPANY_HOST_PORT:-6005}:${COMPANY_PORT:-6005}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      COMPANY_PORT: ${COMPANY_PORT:-6005}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: http://auth:${AUTH_PORT:-6001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}
      RESEND_FROM: ${RESEND_FROM}
      RESEND_TIMEOUT: ${RESEND_TIMEOUT}
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${COMPANY_PORT:-6005}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ommpods:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/ommpods.Dockerfile
    container_name: ommpods
    ports:
      - "${OMMPODS_HOST_PORT:-6007}:${OMMPODS_PORT:-6007}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      OMMPODS_PORT: ${OMMPODS_PORT:-6007}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: http://auth:${AUTH_PORT:-6001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      OMMPODS_SESSION_START_END_DELAY_SECONDS: ${OMMPODS_SESSION_START_END_DELAY_SECONDS:-20}
      OMMPODS_SESSION_START_INTRODUCTORY_VIDEO_DURATION: ${OMMPODS_SESSION_START_INTRODUCTORY_VIDEO_DURATION:-30}
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${OMMPODS_PORT:-6007}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  dokploy-network:
    name: ${DOKPLOY_NETWORK_NAME:-dokploy-network}
    external: true
